
name: Copy All Upstream Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-releases:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Copy upstream releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          git remote add upstream https://github.com/xinntao/facexlib.git

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from urllib.parse import quote

          UPSTREAM = "xinntao/facexlib"
          FORK = os.environ["GITHUB_REPOSITORY"]

          def run(args, **kwargs):
              return subprocess.run(args, check=True, text=True, **kwargs)

          def flatten(items):
              for item in items:
                  if isinstance(item, list):
                      yield from flatten(item)
                  else:
                      yield item

          print("Retrieving all upstream releases...")

          raw = subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{UPSTREAM}/releases"
          ], text=True)

          releases = list(flatten(json.loads(raw)))
          print(f"Found {len(releases)} releases.")

          stable_latest_set = False

          for release in releases:
              tag = release["tag_name"]
              title = release.get("name") or tag

              print(f"\nProcessing {tag}: {title}")

              # Skip releases already copied.
              existing = subprocess.run(
                  ["gh", "release", "view", tag, "--repo", FORK],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if existing.returncode == 0:
                  print("Release already exists. Skipping.")
                  continue

              # Check whether the tag already exists in the fork.
              encoded_tag = quote(tag, safe="")
              tag_path = f"repos/{FORK}/git/ref/tags/{encoded_tag}"

              tag_check = subprocess.run(
                  ["gh", "api", tag_path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if tag_check.returncode != 0:
                  print(f"Creating tag {tag} using GitHub API...")

                  # Fetch the original tag into a temporary local ref.
                  run([
                      "git", "fetch", "--force", "upstream",
                      f"refs/tags/{tag}:refs/tmp/upstream-tags/{tag}"
                  ])

                  commit_sha = subprocess.check_output([
                      "git", "rev-parse",
                      f"refs/tmp/upstream-tags/{tag}^{{commit}}"
                  ], text=True).strip()

                  # Create the tag through the API instead of git push.
                  run([
                      "gh", "api", "--method", "POST",
                      f"repos/{FORK}/git/refs",
                      "-f", f"ref=refs/tags/{tag}",
                      "-f", f"sha={commit_sha}"
                  ])

              print("Downloading release assets to temporary runner storage...")

              with tempfile.TemporaryDirectory() as temp:
                  assets_dir = os.path.join(temp, "assets")
                  os.makedirs(assets_dir)

                  if release.get("assets"):
                      run([
                          "gh", "release", "download", tag,
                          "--repo", UPSTREAM,
                          "--dir", assets_dir,
                          "--clobber"
                      ])

                  notes_path = os.path.join(temp, "notes.md")

                  with open(notes_path, "w", encoding="utf-8") as f:
                      f.write(release.get("body") or "")

                  args = [
                      "gh", "release", "create", tag,
                      "--repo", FORK,
                      "--title", title,
                      "--notes-file", notes_path,
                      "--verify-tag"
                  ]

                  if release.get("prerelease"):
                      args.append("--prerelease")

                  if not release.get("prerelease") and not stable_latest_set:
                      args.append("--latest")
                      stable_latest_set = True
                  else:
                      args.append("--latest=false")

                  for filename in sorted(os.listdir(assets_dir)):
                      filepath = os.path.join(assets_dir, filename)
                      if os.path.isfile(filepath):
                          args.append(filepath)

                  run(args)

              print(f"Successfully copied {tag}.")

          print("\nAll upstream releases processed!")
          PY
