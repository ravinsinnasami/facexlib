
name: Copy All Upstream Releases and Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-releases:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Copy all upstream tags and releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/xinntao/facexlib.git

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from urllib.parse import quote

          UPSTREAM = "xinntao/facexlib"
          FORK = os.environ["GITHUB_REPOSITORY"]

          def run(args):
              return subprocess.run(
                  args,
                  check=True,
                  text=True
              )

          def get_output(args):
              return subprocess.check_output(
                  args,
                  text=True
              ).strip()

          def flatten(items):
              for item in items:
                  if isinstance(item, list):
                      yield from flatten(item)
                  else:
                      yield item

          def api_tag_exists(tag):
              path = f"repos/{FORK}/git/ref/tags/{quote(tag, safe='')}"

              result = subprocess.run(
                  ["gh", "api", path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return result.returncode == 0

          def create_tag(tag):
              temp_ref = f"refs/tmp/upstream-tags/{tag}"

              run([
                  "git", "fetch", "--force", "upstream",
                  f"+refs/tags/{tag}:{temp_ref}"
              ])

              sha = get_output([
                  "git", "rev-parse",
                  f"{temp_ref}^{{commit}}"
              ])

              run([
                  "gh", "api", "--method", "POST",
                  f"repos/{FORK}/git/refs",
                  "-f", f"ref=refs/tags/{tag}",
                  "-f", f"sha={sha}"
              ])

          print("====================================")
          print("STEP 1: COPYING ALL GIT TAGS")
          print("====================================")

          tag_output = get_output([
              "git", "ls-remote", "--refs",
              "upstream", "refs/tags/"
          ])

          upstream_tags = []

          for line in tag_output.splitlines():
              sha, ref = line.split("\t", 1)
              upstream_tags.append(
                  ref.removeprefix("refs/tags/")
              )

          print(f"Found {len(upstream_tags)} upstream tags.")

          tags_created = 0
          tags_skipped = 0

          for tag in upstream_tags:
              print(f"\nChecking tag: {tag}")

              if api_tag_exists(tag):
                  print("Already exists. Skipping.")
                  tags_skipped += 1
                  continue

              create_tag(tag)

              print(f"Created tag: {tag}")
              tags_created += 1

          print("\nTag synchronisation complete.")
          print(f"Created: {tags_created}")
          print(f"Skipped: {tags_skipped}")

          print("\n====================================")
          print("STEP 2: COPYING ALL RELEASES")
          print("====================================")

          raw = get_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{UPSTREAM}/releases"
          ])

          releases = list(flatten(json.loads(raw)))

          print(f"Found {len(releases)} upstream releases.")

          releases_created = 0
          releases_skipped = 0

          # Preserve which stable release is marked latest.
          latest_release = next(
              (
                  r["tag_name"]
                  for r in releases
                  if not r.get("prerelease")
                  and not r.get("draft")
                  and r.get("make_latest") != "false"
              ),
              None
          )

          for release in releases:
              tag = release["tag_name"]
              title = release.get("name") or tag

              print(f"\nProcessing release: {tag}")

              existing = subprocess.run(
                  [
                      "gh", "release", "view", tag,
                      "--repo", FORK
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if existing.returncode == 0:
                  print("Release already exists. Skipping.")
                  releases_skipped += 1
                  continue

              if not api_tag_exists(tag):
                  print(f"Creating missing release tag: {tag}")
                  create_tag(tag)

              with tempfile.TemporaryDirectory() as temp:
                  assets_dir = os.path.join(temp, "assets")
                  os.makedirs(assets_dir)

                  assets = release.get("assets", [])

                  if assets:
                      print(f"Downloading {len(assets)} assets...")

                      run([
                          "gh", "release", "download", tag,
                          "--repo", UPSTREAM,
                          "--dir", assets_dir,
                          "--clobber"
                      ])

                  notes_path = os.path.join(temp, "notes.md")

                  with open(
                      notes_path, "w", encoding="utf-8"
                  ) as f:
                      f.write(release.get("body") or "")

                  args = [
                      "gh", "release", "create", tag,
                      "--repo", FORK,
                      "--title", title,
                      "--notes-file", notes_path,
                      "--verify-tag"
                  ]

                  if release.get("prerelease"):
                      args.append("--prerelease")

                  if tag == latest_release:
                      args.append("--latest")
                  else:
                      args.append("--latest=false")

                  for filename in sorted(os.listdir(assets_dir)):
                      filepath = os.path.join(assets_dir, filename)

                      if os.path.isfile(filepath):
                          args.append(filepath)

                  run(args)

              print(f"Successfully copied release: {tag}")
              releases_created += 1

          print("\n====================================")
          print("TRANSFER SUMMARY")
          print("====================================")
          print(f"Tags created: {tags_created}")
          print(f"Tags skipped: {tags_skipped}")
          print(f"Releases created: {releases_created}")
          print(f"Releases skipped: {releases_skipped}")
          print("\nAll processing completed!")
          PY
